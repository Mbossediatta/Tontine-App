<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Calebasse" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1E5AA8" />
    <meta name="description" content="Gérez vos tontines : cotisations, tours et cagnottes." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preload" as="image" href="/brand/logo-mark.png" />
    <title>Calebasse de l’Espoir</title>
    <!--
      Écran de démarrage : HTML et CSS seulement, affiché dès les premiers octets reçus
      (avant le chargement de l'application, parfois long en 3G). L'application le fait
      disparaître en fondu quand elle est prête (voir src/app/splash.ts).
    -->
    <style>
      #splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 6px;
        padding: 24px;
        overflow: hidden;
        background: radial-gradient(circle at 50% 38%, #ffffff 0%, #f3f7fa 55%, #e3eef9 100%);
        font-family: 'Plus Jakarta Sans', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        text-align: center;
        transition:
          opacity 450ms ease,
          transform 450ms ease;
      }
      #splash.splash-hide {
        opacity: 0;
        transform: scale(1.04);
        pointer-events: none;
      }
      .splash-mark {
        position: relative;
        display: grid;
        place-items: center;
        width: 148px;
        height: 148px;
        margin-bottom: 18px;
      }
      /* Deux ondes vertes qui partent de la calebasse, comme une pièce qui tombe dans l'eau. */
      .splash-ring {
        position: absolute;
        inset: 0;
        border-radius: 50%;
        border: 2px solid #2e9e5b;
        opacity: 0;
        animation: splash-ring 2.4s ease-out 0.7s infinite;
      }
      .splash-ring.second {
        animation-delay: 1.5s;
      }
      .splash-disc {
        position: absolute;
        inset: 10px;
        border-radius: 50%;
        background: #ffffff;
        box-shadow:
          0 10px 30px rgba(25, 87, 184, 0.16),
          0 2px 6px rgba(19, 35, 58, 0.06);
        animation: splash-pop 700ms cubic-bezier(0.2, 0.9, 0.3, 1.25) both;
      }
      .splash-logo {
        position: relative;
        width: 104px;
        height: 104px;
        animation:
          splash-pop 700ms cubic-bezier(0.2, 0.9, 0.3, 1.25) 80ms both,
          splash-float 3.2s ease-in-out 1s infinite;
      }
      /* Trois pièces qui montent doucement autour du logo. */
      .splash-coin {
        position: absolute;
        width: 12px;
        height: 12px;
        border-radius: 50%;
        background: linear-gradient(135deg, #a8e6c1, #2e9e5b);
        opacity: 0;
        animation: splash-coin 2.8s ease-in 1s infinite;
      }
      .splash-coin.c1 { left: 6px; bottom: 30px; }
      .splash-coin.c2 { right: 2px; bottom: 50px; animation-delay: 1.9s; width: 9px; height: 9px; }
      .splash-coin.c3 { left: 40px; bottom: -4px; animation-delay: 2.6s; width: 8px; height: 8px; }
      .splash-title {
        margin: 0;
        font-size: 28px;
        line-height: 34px;
        font-weight: 800;
        color: #1957b8;
        letter-spacing: -0.01em;
        animation: splash-rise 600ms ease-out 350ms both;
      }
      .splash-title span {
        color: #2e9e5b;
      }
      .splash-tagline {
        margin: 0;
        font-size: 16px;
        line-height: 24px;
        color: #52627a;
        animation: splash-rise 600ms ease-out 550ms both;
      }
      .splash-dots {
        display: flex;
        gap: 8px;
        margin-top: 28px;
        animation: splash-rise 500ms ease-out 800ms both;
      }
      .splash-dots i {
        width: 9px;
        height: 9px;
        border-radius: 50%;
        background: #1957b8;
        animation: splash-dot 1.1s ease-in-out infinite;
      }
      .splash-dots i:nth-child(2) {
        background: #2e9e5b;
        animation-delay: 0.15s;
      }
      .splash-dots i:nth-child(3) {
        animation-delay: 0.3s;
      }
      .splash-footer {
        position: absolute;
        bottom: calc(24px + env(safe-area-inset-bottom));
        margin: 0;
        font-size: 13px;
        color: #52627a;
        animation: splash-rise 500ms ease-out 900ms both;
      }
      @keyframes splash-pop {
        from { opacity: 0; transform: scale(0.6); }
        to { opacity: 1; transform: scale(1); }
      }
      @keyframes splash-float {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-5px); }
      }
      @keyframes splash-ring {
        0% { opacity: 0.55; transform: scale(0.85); }
        100% { opacity: 0; transform: scale(1.45); }
      }
      @keyframes splash-coin {
        0% { opacity: 0; transform: translateY(0) scale(0.6); }
        25% { opacity: 1; }
        100% { opacity: 0; transform: translateY(-70px) scale(1); }
      }
      @keyframes splash-rise {
        from { opacity: 0; transform: translateY(12px); }
        to { opacity: 1; transform: translateY(0); }
      }
      @keyframes splash-dot {
        0%, 80%, 100% { transform: translateY(0); opacity: 0.45; }
        40% { transform: translateY(-7px); opacity: 1; }
      }
      /* Mouvements réduits demandés : tout s'affiche directement, sans animation. */
      @media (prefers-reduced-motion: reduce) {
        #splash *,
        #splash {
          animation: none !important;
          transition: opacity 200ms ease !important;
        }
        .splash-ring,
        .splash-coin {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="splash" role="status" aria-label="Chargement de Calebasse de l’Espoir">
      <div class="splash-mark" aria-hidden="true">
        <span class="splash-ring"></span>
        <span class="splash-ring second"></span>
        <span class="splash-disc"></span>
        <span class="splash-coin c1"></span>
        <span class="splash-coin c2"></span>
        <span class="splash-coin c3"></span>
        <img class="splash-logo" src="/brand/logo-mark.png" width="104" height="104" alt="" />
      </div>
      <p class="splash-title">Calebasse <span>de l’Espoir</span></p>
      <p class="splash-tagline">Votre appli de tontine digitale</p>
      <div class="splash-dots" aria-hidden="true"><i></i><i></i><i></i></div>
      <p class="splash-footer">Cotisez, suivez, recevez · en FCFA</p>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
